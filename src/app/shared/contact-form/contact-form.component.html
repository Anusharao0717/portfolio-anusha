<form class="contact-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="input-row">
    <input type="text" formControlName="name" autocomplete="name" maxlength="100" required
           [attr.aria-invalid]="invalid('name')" [attr.aria-describedby]="showError() ? 'contact-form-error' : null"
           [attr.aria-label]="text.name" [placeholder]="text.namePlaceholder">
    <input type="email" formControlName="email" autocomplete="email" required
           [attr.aria-invalid]="invalid('email')" [attr.aria-describedby]="showError() ? 'contact-form-error' : null"
           [attr.aria-label]="text.email" [placeholder]="text.emailPlaceholder">
  </div>
  <textarea rows="6" formControlName="message" maxlength="3000" required
            [attr.aria-invalid]="invalid('message')" [attr.aria-describedby]="showError() ? 'contact-form-error' : null"
            [attr.aria-label]="text.message" [placeholder]="text.messagePlaceholder"></textarea>

  <button class="btn primary" type="submit" [disabled]="status() === 'sending'">
    @if (status() === 'sending') {
      <app-icon class="spin" name="loader-circle" [size]="18" /> {{ text.sending }}
    } @else {
      {{ text.send }} <app-icon name="send" [size]="18" />
    }
  </button>

  @if (showError()) {
    <p id="contact-form-error" class="form-error" role="alert" animate.enter="fade-in">{{ text.formError }}</p>
  }
  @switch (status()) {
    @case ('sent') { <p class="form-success" role="status" animate.enter="fade-in">{{ text.success }}</p> }
    @case ('mailto') { <p class="form-success" role="status" animate.enter="fade-in">{{ text.successMailto }}</p> }
    @case ('error') {
      <p class="form-error" role="alert" animate.enter="fade-in">{{ text.sendError }} <a [href]="'mailto:' + email">{{ email }}</a></p>
    }
  }
</form>
