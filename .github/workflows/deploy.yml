
name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@11.19.1

      - name: Verify Angular project
        run: |
          test -f package.json || {
            echo "ERROR: package.json not found in repository root."
            exit 1
          }
          test -f angular.json || {
            echo "ERROR: angular.json not found in repository root."
            exit 1
          }

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Angular app
        run: npm run build -- --base-href=/portfolio-anusha/

      - name: Prepare Pages files
        id: output
        shell: bash
        run: |
          INDEX_FILE=$(find dist -type f -name index.html -print -quit)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: No index.html found under dist."
            exit 1
          fi

          SITE_DIR=$(dirname "$INDEX_FILE")
          cp "$INDEX_FILE" "$SITE_DIR/404.html"
          echo "path=$SITE_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.output.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
